[ScaleNG]
enabled=1
upscaler=dlss
scale=0.67
sharpness=0.0
perfQuality=1
mvJittered=1
autoExposure=1
appId=241534720

[bridge]
; Use the separate NGX process because BeamNG's in-process device is wrapper-blocked.
helper=1
; Evaluation-only safety mode: direct Present-time replacement currently
; crashes BeamNG immediately after the first acknowledged helper frame.
replaceOutput=0
deferredOutput=1
; Queue-submitted swapchain copy is disabled: the first guarded copy still
; causes device removal in BeamNG after the fence wait succeeds.
queueCopy=0
